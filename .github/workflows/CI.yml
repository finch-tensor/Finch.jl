name: CI
on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  style:
    name: Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v1
        with:
          version: '1'
      - uses: julia-actions/julia-buildpkg@v1
      - name: Run style tests
        run: julia --color=yes test/runtests.jl --include style

  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    needs: style
    runs-on: ${{ matrix.os }}
    env:
      FINCH_TEST_ARGS: --exclude style
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10.6'
          - '1'
        os:
          - ubuntu-latest
          - windows-latest
        arch:
          - x64
          - x86
        exclude:
          - os: ubuntu-latest
            arch: x86
          - os: windows-latest
            arch: x64
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v1
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: prefix-dev/setup-pixi@v0.10.2
        if: runner.os == 'Linux'
        with:
          run-install: false
      - uses: actions/cache@v4
        env:
          cache-name: cache-artifacts
        with:
          path: ~/.julia/artifacts
          key: ${{ runner.os }}-test-${{ env.cache-name }}-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-test-${{ env.cache-name }}-
            ${{ runner.os }}-test-
            ${{ runner.os }}-
      - uses: julia-actions/julia-buildpkg@v1
      - name: Set and Retrieve Github ENV variables
        shell: bash
        run: |
          echo "JULIA_NUM_THREADS=2" >> $GITHUB_ENV
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  docs:
    name: Documentation
    needs: style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v1
        with:
          version: '1'
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}

  finch-tensor-tests:
    name: Python finch-tensor tests
    # Re-enable on this branch once the Python hash interface is updated.
    if: ${{ (github.head_ref || github.ref_name) != 'wma/split-offset-merged' }}
    needs: style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Galley.jl
        uses: actions/checkout@v4
      - name: Setup Julia
        uses: julia-actions/setup-julia@v1
        with:
          # Match the Julia versions supported by the Python backend.
          version: '1.12'
      - name: Build Galley.jl package
        uses: julia-actions/julia-buildpkg@v1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Checkout finch-tensor
        uses: actions/checkout@v4
        with:
          repository: finch-tensor/finch-tensor
          ref: 'main'
          path: 'finch-tensor'
      - name: Point the Python backend at Galley
        run: python test/rename_python_backend.py finch-tensor
      - name: Install package
        working-directory: finch-tensor
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group test --editable '.[julia]'
      - name: Use this Galley.jl checkout
        working-directory: finch-tensor
        run: |
          python - <<'PY'
          import os
          import juliapkg

          juliapkg.add(
              "Galley",
              uuid="9177782c-1635-4eb9-9bfb-d9dfa25e6bce",
              path=os.environ["GITHUB_WORKSPACE"],
              dev=True,
          )
          juliapkg.resolve()

          from finch.compile_jl.julia import jl

          assert os.path.samefile(
              str(jl.seval("pkgdir(Galley)")), os.environ["GITHUB_WORKSPACE"]
          )
          PY
      - name: Run finch-tensor tests
        working-directory: finch-tensor
        run: |
          python -m pytest src/finch/tests/test_julia*.py src/finch/tests/test_accuracy.py

  galley-jl-python-tests:
    name: Python galley-jl-python tests
    # Re-enable on this branch once the Python hash interface is updated.
    if: ${{ (github.head_ref || github.ref_name) != 'wma/split-offset-merged' }}
    needs: style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Galley.jl
        uses: actions/checkout@v4
      - name: Setup Julia
        uses: julia-actions/setup-julia@v1
        with:
          version: '1.10'
      - name: Build Galley.jl package
        uses: julia-actions/julia-buildpkg@v1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Poetry
        uses: snok/install-poetry@v1
      - name: Checkout galley-jl-python
        uses: actions/checkout@v4
        with:
          # Keep testing the original Array API wrapper against this checkout.
          repository: finch-tensor/galley-jl-python
          ref: 'v0.2.13'
          path: 'galley-jl-python'
      - name: Point the Python backend at Galley
        run: python test/rename_python_backend.py galley-jl-python
      - name: Install package
        run: |
          cd galley-jl-python
          poetry install --extras test
          poetry run python develop.py --path "${GITHUB_WORKSPACE}"
      - name: Run galley-jl-python tests
        run: |
          cd galley-jl-python
          poetry run pytest tests/
